name: Clarivo Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-and-tests:
    name: Backend Quality & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx flake8

      - name: Code Quality & Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Execute Enterprise API Test Suite
        env:
          DATABASE_URL: "sqlite:///./clarivo.db"
          SECRET_KEY: "ci-testing-key-value"
        run: |
          cd backend
          pytest tests/ -v

  frontend-build-and-lint:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Verify TypeScript & Build Bundle
        env:
          CI: false
          GENERATE_SOURCEMAP: false
        run: |
          cd frontend
          npm run build

  docker-image-verify:
    name: Production Docker Container Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-and-tests, frontend-build-and-lint]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: clarivo-enterprise:latest

